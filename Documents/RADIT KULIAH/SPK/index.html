<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopFlex - E-Commerce Modern</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-in-out',
                        'slide-up': 'slideUp 0.3s ease-out',
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .cart-slide { animation: slideUp 0.3s ease-out; }
    </style>
</head>
<body class="bg-gray-50 font-sans">

<!-- Header -->
<header class="bg-white shadow-lg sticky top-0 z-50">
    <div class="container mx-auto px-4">
        <div class="flex justify-between items-center py-4">
            <!-- Logo -->
            <div class="flex items-center space-x-3">
                <i class="fas fa-store text-3xl text-blue-600"></i>
                <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">
                    ShopFlex
                </h1>
            </div>

            <!-- Search Bar -->
            <div class="flex-1 max-w-md mx-8 hidden md:flex">
                <div class="relative w-full">
                    <input type="text" id="searchInput" placeholder="Cari produk..." 
                           class="w-full pl-12 pr-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300">
                    <i class="fas fa-search absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                </div>
            </div>

            <!-- Icons -->
            <div class="flex items-center space-x-4">
                <button id="cartBtn" class="relative p-2 text-gray-700 hover:text-blue-600 transition-colors">
                    <i class="fas fa-shopping-cart text-xl"></i>
                    <span id="cartCount" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full h-6 w-6 flex items-center justify-center text-sm">0</span>
                </button>
                <button id="wishlistBtn" class="p-2 text-gray-700 hover:text-red-500 transition-colors">
                    <i class="far fa-heart text-xl"></i>
                </button>
                <button id="accountBtn" class="p-2 text-gray-700 hover:text-blue-600 transition-colors">
                    <i class="fas fa-user text-xl"></i>
                </button>
            </div>
        </div>
    </div>
</header>

<!-- Hero Section -->
<section class="bg-gradient-to-r from-blue-600 to-purple-600 text-white py-20">
    <div class="container mx-auto px-4 text-center">
        <h2 class="text-5xl md:text-6xl font-bold mb-6 animate-fade-in">Belanja Online<br><span class="text-blue-200">Terbaik</span></h2>
        <p class="text-xl mb-8 opacity-90 max-w-2xl mx-auto">Temukan produk berkualitas dengan harga terbaik. Gratis ongkir untuk pembelian di atas Rp 200.000</p>
        <div class="flex flex-col sm:flex-row gap-4 justify-center items-center">
            <a href="#products" class="bg-white text-blue-600 px-12 py-4 rounded-xl font-semibold text-lg hover:bg-gray-100 transition-all duration-300 transform hover:scale-105">Belanja Sekarang</a>
            <button class="border-2 border-white px-12 py-4 rounded-xl font-semibold text-lg hover:bg-white hover:text-blue-600 transition-all duration-300">Lihat Promo</button>
        </div>
    </div>
</section>

<!-- Products Section -->
<section id="products" class="py-20 bg-gray-50">
    <div class="container mx-auto px-4">
        <div class="text-center mb-16">
            <h3 class="text-4xl font-bold text-gray-800 mb-4">Produk Terlaris</h3>
            <p class="text-xl text-gray-600 max-w-2xl mx-auto">Koleksi produk terbaik dengan kualitas premium</p>
        </div>

        <!-- Filters -->
        <div class="flex flex-wrap gap-4 mb-8 items-center">
            <select id="categoryFilter" class="px-4 py-2 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">Semua Kategori</option>
                <option value="electronics">Elektronik</option>
                <option value="fashion">Fashion</option>
                <option value="home">Rumah Tangga</option>
                <option value="sport">Olahraga</option>
            </select>
            <select id="sortFilter" class="px-4 py-2 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="default">Urutkan</option>
                <option value="price-low">Harga Terendah</option>
                <option value="price-high">Harga Tertinggi</option>
                <option value="popular">Paling Populer</option>
            </select>
            <div class="flex items-center space-x-2 text-sm text-gray-600 ml-auto">
                <i class="fas fa-th-large"></i>
                <i class="fas fa-th-list cursor-pointer hover:text-blue-600"></i>
            </div>
        </div>

        <!-- Products Grid -->
        <div id="productsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
            <!-- Products will be loaded here -->
        </div>
    </div>
</section>

<!-- Shopping Cart Modal -->
<div id="cartModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto cart-slide">
        <div class="p-8 border-b">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-2xl font-bold text-gray-800">Keranjang Belanja</h3>
                <button id="closeCart" class="text-gray-500 hover:text-gray-700 text-2xl">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <p id="cartEmpty" class="text-gray-500 text-center py-8 hidden">Keranjang Anda kosong</p>
            <div id="cartItems"></div>
            <div id="cartTotal" class="mt-8 pt-8 border-t hidden">
                <div class="flex justify-between text-xl font-bold mb-6">
                    <span>Total:</span>
                    <span id="totalAmount">Rp 0</span>
                </div>
                <button class="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white py-4 rounded-xl font-semibold text-lg hover:from-blue-700 hover:to-purple-700 transition-all duration-300 transform hover:scale-105">
                    Checkout Sekarang
                </button>
            </div>
        </div>
    </div>
</div>

<script>
class ECommerceApp {
    constructor() {
        this.products = [
            { id: 1, name: "iPhone 15 Pro", price: 18999000, image: "https://images.unsplash.com/photo-1690489876627-7f363867e3fd?w=400", category: "electronics", rating: 4.9, reviews: 128 },
            { id: 2, name: "Samsung Galaxy S24", price: 15999000, image: "https://images.unsplash.com/photo-1701179904329-e9eb99e9600f?w=400", category: "electronics", rating: 4.8, reviews: 95 },
            { id: 3, name: "Nike Air Max", price: 1299000, image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400", category: "fashion", rating: 4.7, reviews: 234 },
            { id: 4, name: "Adidas Ultraboost", price: 1899000, image: "https://images.unsplash.com/photo-1549298916-b41d501d3772?w=400", category: "fashion", rating: 4.9, reviews: 156 },
            { id: 5, name: "Dyson Airwrap", price: 8999000, image: "https://images.unsplash.com/photo-1608248597781-cf949a3bacce?w=400", category: "home", rating: 4.6, reviews: 89 },
            { id: 6, name: "Coffee Maker", price: 1299000, image: "https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=400", category: "home", rating: 4.8, reviews: 203 },
            { id: 7, name: "Yoga Mat", price: 399000, image: "https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?w=400", category: "sport", rating: 4.7, reviews: 167 },
            { id: 8, name: "Dumbbell Set", price: 799000, image: "https://images.unsplash.com/photo-1579952363873-27d3bfad9c3e?w=400", category: "sport", rating: 4.9, reviews: 89 }
        ];
        
        this.cart = JSON.parse(localStorage.getItem('cart')) || [];
        this.init();
    }

    init() {
        this.bindEvents();
        this.renderProducts();
        this.updateCartCount();
    }

    bindEvents() {
        // Cart toggle
        document.getElementById('cartBtn').addEventListener('click', () => {
            document.getElementById('cartModal').classList.remove('hidden');
        });

        document.getElementById('closeCart').addEventListener('click', () => {
            document.getElementById('cartModal').classList.add('hidden');
        });

        // Filters
        document.getElementById('categoryFilter').addEventListener('change', (e) => this.filterProducts(e.target.value));
        document.getElementById('sortFilter').addEventListener('change', (e) => this.sortProducts(e.target.value));

        // Search
        document.getElementById('searchInput').addEventListener('input', (e) => this.searchProducts(e.target.value));
    }

    renderProducts(products = this.products) {
        const grid = document.getElementById('productsGrid');
        grid.innerHTML = products.map(product => `
            <div class="bg-white rounded-2xl shadow-xl hover:shadow-2xl transition-all duration-300 overflow-hidden group animate-fade-in">
                <div class="relative h-64 overflow-hidden">
                    <img src="${product.image}" alt="${product.name}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
                    <div class="absolute top-4 right-4 bg-yellow-400 text-black px-2 py-1 rounded-full text-sm font-bold">
                        ${product.rating} ⭐
                    </div>
                    <button class="absolute bottom-4 right-4 bg-white p-3 rounded-xl shadow-lg opacity-0 group-hover:opacity-100 transition-all duration-300 hover:bg-red-500 hover:text-white">
                        <i class="fas fa-heart"></i>
                    </button>
                </div>
                <div class="p-6">
                    <h4 class="font-semibold text-lg text-gray-800 mb-2 line-clamp-2">${product.name}</h4>
                    <div class="flex items-center justify-between">
                        <div class="text-2xl font-bold text-blue-600">
                            Rp ${product.price.toLocaleString('id-ID')}
                        </div>
                        <span class="text-sm text-gray-500">(${product.reviews} ulasan)</span>
                    </div>
                    <button onclick="app.addToCart(${product.id})" 
                            class="w-full mt-4 bg-gradient-to-r from-blue-600 to-purple-600 text-white py-3 rounded-xl font-semibold hover:from-blue-700 hover:to-purple-700 transition-all duration-300 transform hover:scale-105">
                        <i class="fas fa-shopping-cart mr-2"></i>Tambahkan
                    </button>
                </div>
            </div>
        `).join('');
    }

    addToCart(productId) {
        const product = this.products.find(p => p.id === productId);
        const existingItem = this.cart.find(item => item.id === productId);

        if (existingItem) {
            existingItem.quantity += 1;
        } else {
            this.cart.push({ ...product, quantity: 1 });
        }

        localStorage.setItem('cart', JSON.stringify(this.cart));
        this.updateCartCount();
        this.renderCart();
        
        // Show notification
        this.showNotification(`${product.name} ditambahkan ke keranjang!`);
    }

    updateCartCount() {
        const count = this.cart.reduce((sum, item) => sum + item.quantity, 0);
        document.getElementById('cartCount').textContent = count;
    }

    renderCart() {
        const cartItems = document.getElementById('cartItems');
        const cartEmpty = document.getElementById('cartEmpty');
        const cartTotal = document.getElementById('cartTotal');

        if (this.cart.length === 0) {
            cartEmpty.classList.remove('hidden');
            cartTotal.classList.add('hidden');
            return;
        }

        cartEmpty.classList.add('hidden');
        cartTotal.classList.remove('hidden');

        cartItems.innerHTML = this.cart.map((item, index) => `
            <div class="flex items-center space-x-4 py-4 border-b last:border-b-0">
                <img src="${item.image}" alt="${item.name}" class="w-20 h-20 object-cover rounded-xl">
                <div class="flex-1">
                    <h4 class="font-semibold text-gray-800">${item.name}</h4>
                    <p class="text-blue-600 font-bold">Rp ${item.price.toLocaleString('id-ID')}</p>
                </div>
                <div class="flex items-center space-x-3">
                    <button onclick="app.updateQuantity(${index}, -1)" class="w-10 h-10 border rounded-lg flex items-center justify-center hover:bg-gray-100">-</button>
                    <span class="font-semibold w-8 text-center">${item.quantity}</span>
                    <button onclick="app.updateQuantity(${index}, 1)" class="w-10 h-10 border rounded-lg flex items-center justify-center hover:bg-gray-100">+</button>
                </div>
                <button onclick="app.removeFromCart(${index})" class="text-red-500 hover:text-red-700">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        `).join('');

        const total = this.cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
        document.getElementById('totalAmount').textContent = `Rp ${total.toLocaleString('id-ID')}`;
    }

    updateQuantity(index, change) {
        this.cart[index].quantity += change;
        if (this.cart[index].quantity <= 0) {
            this.cart.splice(index, 1);
        }
        localStorage.setItem('cart', JSON.stringify(this.cart));
        this.updateCartCount();
        this.renderCart();
    }

    removeFromCart(index) {
        this.cart.splice(index, 1);
        localStorage.setItem('cart', JSON.stringify(this.cart));
        this.updateCartCount();
        this.renderCart();
    }

    filterProducts(category) {
        const filtered = category ? 
            this.products.filter(p => p.category === category) : 
            this.products;
        this.renderProducts(filtered);
    }

    sortProducts(sortBy) {
        let sorted = [...this.products];
        switch(sortBy) {
            case 'price-low':
                sorted.sort((a, b) => a.price - b.price);
                break;
            case 'price-high':
                sorted.sort((a, b) => b.price - a.price);
                break;
            case 'popular':
                sorted.sort((a, b) => b.reviews - a.reviews);
                break;
        }
        this.renderProducts(sorted);
    }

    searchProducts(query) {
        const filtered = this.products.filter(p => 
            p.name.toLowerCase().includes(query.toLowerCase())
        );
        this.renderProducts(filtered);
    }

    showNotification(message) {
        const notification = document.createElement('div');
        notification.className = 'fixed top-20 right-4 bg-green-500 text-white px-6 py-4 rounded-xl shadow-2xl z-50 animate-fade-in';
        notification.textContent = message;
        document.body.appendChild(notification);
        
        setTimeout(() => {
            notification.remove();
        }, 3000);
    }
}

// Initialize app
const app = new ECommerceApp();

// Close modal on outside click
document.getElementById('cartModal').addEventListener('click', (e) => {
    if (e.target.id === 'cartModal') {
        e.target.classList.add('hidden');
    }
});
</script>

</body>
</html>
